services:
  db:
    image: postgres:16-alpine
    container_name: arx-hub-db
    environment:
      POSTGRES_DB: arxhub
      POSTGRES_USER: arxhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arxhub_dev_password}
    volumes:
      - arxhub_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxhub -d arxhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: ./app
    container_name: arx-hub
    ports:
      - "8317:8317"
      # proxy das automações (app/proxy.js): o navegador abre as telas só por aqui, sem ver o endereço delas
      - "8318:8318"
    environment:
      DATABASE_URL: postgres://arxhub:${POSTGRES_PASSWORD:-arxhub_dev_password}@db:5432/arxhub
      PORT: "8317"
      NODE_ENV: ${NODE_ENV:-production}
      # Em produção o Hub se recusa a subir sem POSTGRES_PASSWORD (ver app/config.js).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      CHECK_INTERVAL_MS: ${CHECK_INTERVAL_MS:-15000}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-3000}
      GLPI_BASE_URL: ${GLPI_BASE_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_ENTITY_ID: ${GLPI_ENTITY_ID:-}
      GLPI_SITE_URL: ${GLPI_SITE_URL:-}
      # segredo que o chamados-glpi usa para ler a conexão do GLPI escolhida na Administração (scripts/gerar-segredo-servico.sh)
      HUB_SERVICO_TOKEN: ${HUB_SERVICO_TOKEN:-}
      # Quem é administrador do Hub na primeira subida (nome completo ou login do GLPI, separados por ;). Depois a lista
      # é gerida no painel de administração.
      HUB_ADMINS_INICIAIS: ${HUB_ADMINS_INICIAIS:-Carlos Eduardo de Souza Alonso}
      # Robô do WhatsApp: segredo que só o robô conhece e, se quiser abrir chamado 24 horas, o token de um usuário de serviço do
      # GLPI. Os dois ficam no .env (fora do Git), nunca aqui.
      WHATSAPP_BOT_TOKEN: ${WHATSAPP_BOT_TOKEN:-}
      HUB_GLPI_TOKEN_SERVICO: ${HUB_GLPI_TOKEN_SERVICO:-}
      CHAMADOS_GLPI_URL: ${CHAMADOS_GLPI_URL:-http://chamados-glpi:4013}
      # IA local (ARX-Automacoes/ia-local): segredos gerados por scripts/gerar-segredo-ia.sh, só no .env
      IA_TOKEN: ${IA_TOKEN:-}
      IA_CONTROLE_TOKEN: ${IA_CONTROLE_TOKEN:-}
    # Rede das automações (projeto ARX-Automacoes): o Hub e o proxy falam com elas pelo nome do container, e as portas 40xx
    # ficam publicadas só em 127.0.0.1 (ninguém na rede as acessa direto).
    networks:
      - default
      - automacoes
      # rede interna da IA local (sem internet): fala com ia-local:4025 (WhatsApp, auditoria, treino)
      - ia
    # Tutoriais em vídeo do botão "?" (pasta fora do Git): TUTORIAIS_DIR no .env aponta para a pasta videos gerada
    # em Documentacao-Automacoes; sem ela, o Hub sobe igual e o botão não aparece.
    volumes:
      - ${TUTORIAIS_DIR:-./tutoriais-videos}:/usr/src/app/tutoriais:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arxhub_db_data:

networks:
  automacoes:
    external: true
    name: arx-automacoes_default
  ia:
    external: true
    name: arx-ia-interna
