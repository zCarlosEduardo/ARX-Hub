<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARX Automação de exemplo</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="exemplo.css">
  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem('arxhub_exemplo_tema') || localStorage.getItem('arx-tema'); } catch (e) { /* sem armazenamento: tema claro */ }
      d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      window.addEventListener('message', function (ev) {
        if (ev.data && ev.data.type === 'arx-theme') d.setAttribute('data-theme', ev.data.theme === 'dark' ? 'dark' : 'light');
      });
    })();
  </script>
  <link rel="stylesheet" href="exemplo-automacao.css">
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="icons.js"></script>
  <script src="exemplo-dados.js"></script>
  <script src="exemplo-ui.js"></script>
  <script src="exemplo-automacoes.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="exemplo-automacao.js"></script>
</body>
</html>
