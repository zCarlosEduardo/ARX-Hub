<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARX Modelos de card</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/v3/v3.css">
  <link rel="stylesheet" href="/modelos-cards.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('arx-tema'); } catch (e) { /* sem armazenamento: tema claro */ }
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <!-- Vitrine de modelos de card para o painel: mesmas automações, status e execuções do Hub, só para escolher o visual. -->
  <div id="root"></div>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/icons.js" defer></script>
  <script src="/modelos-cards.js" defer></script>
</body>
</html>
