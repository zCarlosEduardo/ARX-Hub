<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARX Hub</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var d = document.documentElement;
      function apply(t) {
        t = t === 'dark' ? 'dark' : 'light';
        d.setAttribute('data-theme', t);
        try { localStorage.setItem('arx-tema', t); } catch (e) {}
      }
      var q = new URLSearchParams(location.search).get('theme'), s = null;
      try { s = localStorage.getItem('arx-tema'); } catch (e) {}
      apply(q || s || 'light');
      // O sistema pai (ArxConnect) pode trocar o tema: postMessage({ type: 'arx-theme', theme: 'dark' | 'light' }).
      window.addEventListener('message', function (ev) {
        if (ev.data && ev.data.type === 'arx-theme') apply(ev.data.theme);
      });
    })();
  </script>
  <script>
    // Repassa o tema recebido do sistema pai para as automações abertas em iframe.
    (function () {
      function post(f) {
        try { f.contentWindow.postMessage({ type: 'arx-theme', theme: document.documentElement.getAttribute('data-theme') }, '*'); } catch (e) {}
      }
      document.addEventListener('load', function (ev) { if (ev.target && ev.target.tagName === 'IFRAME') post(ev.target); }, true);
      new MutationObserver(function () { document.querySelectorAll('iframe').forEach(post); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="versao.js" defer></script>
  <script src="icons.js" defer></script>
  <script src="acessos.js" defer></script>
  <script src="alertas.js" defer></script>
  <script src="chamados.js" defer></script>
  <script src="graficos-dados.js" defer></script>
  <script src="graficos.js" defer></script>
  <script src="disponibilidade.js" defer></script>
  <script src="resultados.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
