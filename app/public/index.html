<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- extensões de modo escuro (Dark Reader e parecidas) não repintam o Hub: ele já tem o próprio tema -->
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="dark light">
  <title>ARX Hub</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/v3/v3.css">
  <script>
    (function () {
      var d = document.documentElement;
      function apply(t) {
        t = t === 'dark' ? 'dark' : 'light';
        d.setAttribute('data-theme', t);
        try { localStorage.setItem('arx-tema', t); } catch (e) { /* sem armazenamento: vale só nesta aba */ }
      }
      var q = new URLSearchParams(location.search).get('theme'), s = null;
      try { s = localStorage.getItem('arx-tema'); } catch (e) { /* sem armazenamento: tema claro */ }
      apply(q || s || 'light');
      // O sistema pai (ArxConnect) pode trocar o tema: postMessage({ type: 'arx-theme', theme: 'dark' | 'light' }).
      window.addEventListener('message', function (ev) {
        if (ev.data && ev.data.type === 'arx-theme') apply(ev.data.theme);
      });
    })();
  </script>
  <script>
    // Repassa o tema recebido do sistema pai para as automações abertas em iframe.
    (function () {
      function post(f) {
        try { f.contentWindow.postMessage({ type: 'arx-theme', theme: document.documentElement.getAttribute('data-theme') }, '*'); } catch (e) { /* iframe ainda sem janela */ }
      }
      document.addEventListener('load', function (ev) { if (ev.target && ev.target.tagName === 'IFRAME') post(ev.target); }, true);
      new MutationObserver(function () { document.querySelectorAll('iframe').forEach(post); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</head>
<body>
  <!-- Hub no layout novo (antes em /v3/): os scripts próprios ficam em /v3/. A versão anterior segue em /original/. -->
  <div id="root"></div>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/versao.js" defer></script>
  <script src="/icons.js" defer></script>
  <script src="/exemplo-ui.js" defer></script>
  <script src="/vendor/arx-cripto.min.js" defer></script>
  <script src="/cofre.js" defer></script>
  <script src="/v3/acessos.js" defer></script>
  <script src="/admin.js" defer></script>
  <script src="/alertas.js" defer></script>
  <script src="/chamados-cache.js" defer></script>
  <script src="/chamados-auto.js" defer></script>
  <script src="/v3/chamados.js" defer></script>
  <script src="/v3/resultados.js" defer></script>
  <script src="/arx-ajuda.js" defer></script>
  <script src="/ajuda.js" defer></script>
  <script src="/v3/app.js" defer></script>
</body>
</html>
