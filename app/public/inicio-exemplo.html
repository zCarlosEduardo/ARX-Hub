<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARX Hub de exemplo</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('arxhub_exemplo_tema') || localStorage.getItem('arx-tema'); } catch (e) { /* sem armazenamento: tema claro */ }
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
    // Repassa o tema para as automações abertas em iframe (igual ao index.html).
    (function () {
      function post(f) {
        try { f.contentWindow.postMessage({ type: 'arx-theme', theme: document.documentElement.getAttribute('data-theme') }, '*'); } catch (e) { /* iframe ainda sem janela */ }
      }
      document.addEventListener('load', function (ev) { if (ev.target && ev.target.tagName === 'IFRAME') post(ev.target); }, true);
      new MutationObserver(function () { document.querySelectorAll('iframe').forEach(post); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
  <style>
    /* Hub de exemplo: só tokens do styles.css (mesmas cores do Hub e da Administração). */
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    .ex-app { display: flex; flex-direction: column; height: 100vh; }

    /* barra do topo: marca, páginas, telas abertas e ações (como o Hub atual) */
    .ex-topo { display: flex; align-items: stretch; gap: 4px; height: 56px; padding: 0 16px 0 20px; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; z-index: 10; }
    .ex-marca { display: flex; align-items: center; gap: 8px; padding-right: 14px; margin-right: 6px; flex-shrink: 0; }
    .ex-logo { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
    .ex-tag { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warn-tint); color: var(--warn); }
    .ex-nav { display: flex; align-items: stretch; gap: 2px; flex-shrink: 0; }
    .ex-aba { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 12px; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; min-width: 0; }
    .ex-aba::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: transparent; }
    .ex-aba:hover { color: var(--text); }
    .ex-aba:hover::after { background: var(--border-hover); }
    .ex-aba.ativo { color: var(--text); font-weight: 600; }
    .ex-aba.ativo::after { background: var(--accent); }
    .ex-aba svg { flex-shrink: 0; }
    .ex-sep { width: 1px; background: var(--border); margin: 14px 6px; flex-shrink: 0; }
    .ex-abertas { display: flex; align-items: stretch; gap: 2px; min-width: 0; flex: 0 1 auto; overflow-x: auto; scrollbar-width: none; }
    .ex-abertas::-webkit-scrollbar { display: none; }
    .ex-abertas .ex-aba { max-width: 220px; flex-shrink: 0; }
    .ex-aba .rot { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .ex-aba .ponto { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .ex-aba .fechar { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--muted-soft); flex-shrink: 0; opacity: 0; }
    .ex-aba:hover .fechar, .ex-aba.ativo .fechar, .ex-aba:focus-visible .fechar { opacity: 1; }
    .ex-aba .fechar:hover { background: var(--hover-bg); color: var(--text); }
    .ex-acoes { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .ex-espaco { flex: 1; min-width: 12px; }
    .ex-busca-btn { display: flex; align-items: center; gap: 8px; width: 220px; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--muted-soft); font: inherit; font-size: 13px; cursor: pointer; }
    .ex-busca-btn span { flex: 1; text-align: left; }
    .ex-busca-btn:hover { border-color: var(--border-hover); }
    kbd { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--secondary); color: var(--muted-soft); }
    .ex-saude { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .ex-saude i { width: 7px; height: 7px; border-radius: 50%; }
    .ex-icone-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; flex-shrink: 0; text-decoration: none; }
    .ex-icone-btn:hover { background: var(--hover-bg); }
    .ex-conteudo { flex: 1; min-height: 0; position: relative; }
    .ex-pagina { position: absolute; inset: 0; overflow-y: auto; }
    .ex-pagina[hidden] { display: none; }

    /* Painel */
    .ex-tela { max-width: 1480px; margin: 0 auto; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 18px; }
    .ex-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .ex-cab h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .ex-cab p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .ex-alerta { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--error-tint); border: 1px solid var(--error-border); font-size: 13px; line-height: 1.5; }
    .ex-alerta b { color: var(--error); }
    .ex-rapido { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .ex-rapido::-webkit-scrollbar { display: none; }
    .ex-rapido-rot { font-size: 12px; color: var(--muted); white-space: nowrap; margin-right: 2px; }
    .ex-pilula { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .ex-pilula:hover { border-color: var(--border-hover); background: var(--hover-bg-soft); }
    .ex-pilula-ic { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ex-pilula .ic { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .ex-barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ex-filtro { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--field-bg); }
    .ex-filtro:focus-within { border-color: var(--ring-border); box-shadow: 0 0 0 3px var(--ring); }
    .ex-filtro input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
    .ex-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--secondary); }
    .ex-seg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: none; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .ex-seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow-card); }
    .ex-seg .n { font-variant-numeric: tabular-nums; color: var(--muted-soft); }
    .ex-grade { display: grid; grid-template-columns: repeat(var(--colunas, 4), minmax(0, 1fr)); gap: 12px; }
    .ex-card { position: relative; display: flex; flex-direction: column; gap: 8px; height: 148px; box-sizing: border-box; padding: 14px 16px; min-width: 0; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); cursor: pointer; transition: box-shadow 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease); }
    .ex-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
    .ex-card.fora { border-color: var(--error-border); }
    .ex-card-topo { display: flex; align-items: center; gap: 10px; min-width: 0; padding-right: 28px; }
    .ex-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ex-nome { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ex-cat { font-size: 11px; color: var(--muted-soft); }
    .ex-desc { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ex-rodape { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
    .ex-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .ex-status i { width: 7px; height: 7px; border-radius: 50%; }
    .ex-status.online { color: var(--accent-fg); } .ex-status.online i { background: var(--accent); }
    .ex-status.offline { color: var(--error); } .ex-status.offline i { background: var(--error); }
    .ex-status.checking { color: var(--warn); } .ex-status.checking i { background: var(--warn); }
    :root[data-theme="dark"] .ex-status.online { color: var(--accent); }
    .ex-abrir { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
    .ex-card:hover .ex-abrir { color: var(--text); }
    .ex-estrela { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 6px; background: transparent; color: var(--muted-soft); cursor: pointer; font-size: 16px; line-height: 1; opacity: 0; }
    .ex-card:hover .ex-estrela, .ex-linha:hover .ex-estrela, .ex-estrela:focus-visible, .ex-estrela[aria-pressed="true"] { opacity: 1; }
    .ex-estrela[aria-pressed="true"] { color: var(--warn); }
    .ex-estrela:hover { background: var(--hover-bg); }
    .ex-lista { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
    .ex-linha { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1.2fr) minmax(0, 2fr) 104px 28px; align-items: center; gap: 12px; height: 52px; box-sizing: border-box; padding: 0 14px; cursor: pointer; }
    .ex-linha + .ex-linha { border-top: 1px solid var(--border); }
    .ex-linha:hover { background: var(--hover-bg-soft); }
    .ex-linha .ex-desc { -webkit-line-clamp: 1; }
    .ex-linha .ex-estrela { position: static; }
    .ex-paginacao { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
    .ex-paginas { display: flex; align-items: center; gap: 4px; }
    .ex-pag { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .ex-pag:hover:not(:disabled) { background: var(--hover-bg); }
    .ex-pag[aria-current="page"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
    .ex-pag:disabled { opacity: 0.45; cursor: default; }
    .ex-link { border: none; background: none; color: var(--text); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .ex-esqueleto { height: 148px; border-radius: 12px; background: linear-gradient(90deg, var(--secondary) 25%, var(--hover-bg-soft) 50%, var(--secondary) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    button:focus-visible, .ex-card:focus-visible, .ex-linha:focus-visible { outline: 2px solid var(--ring-border); outline-offset: 2px; }

    /* tela de uma automação aberta */
    .ex-visor { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .ex-visor-barra { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--border); background: var(--card); font-size: 12.5px; flex-shrink: 0; }
    .ex-visor-barra .acoes { margin-left: auto; display: flex; gap: 4px; }
    .ex-visor-barra button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: none; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; }
    .ex-visor-barra button:hover { background: var(--hover-bg); color: var(--text); }
    .ex-visor iframe { flex: 1; width: 100%; border: none; background: var(--bg); }
    .ex-carregando { position: absolute; inset: 40px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; background: var(--bg); }

    /* Chamados e Resultados (componentes reais) dentro da moldura nova */
    .ex-legado > div[style*="max-width: 1200px"] { max-width: 1480px !important; padding: 24px 24px 48px !important; }
    .ex-legado > div > div[style*="padding: 18px 24px 0"] { max-width: 1480px !important; }
    .ex-legado [style*="font-size: 19px"] { font-size: 20px !important; letter-spacing: -0.01em; }
    .ex-legado [style*="border-radius: 14px"] { border-radius: 12px !important; box-shadow: var(--shadow-card); }
    .ex-legado [style*="animation: fadeInUp"] { animation: none !important; }

    /* busca geral (Ctrl K) */
    .ex-fundo { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; z-index: 50; animation: fadeIn 0.12s ease; }
    .ex-paleta { width: 100%; max-width: 560px; background: var(--popover); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); overflow: hidden; animation: modalIn 0.16s var(--ease); }
    .ex-paleta-busca { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px; border-bottom: 1px solid var(--border); }
    .ex-paleta-busca input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 14px; }
    .ex-paleta ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
    .ex-paleta li.titulo { font-size: 11px; font-weight: 600; color: var(--muted-soft); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .ex-paleta li.opcao { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .ex-paleta li.opcao[aria-selected="true"] { background: var(--secondary); }
    .ex-paleta li.opcao .dir { margin-left: auto; font-size: 11.5px; color: var(--muted-soft); }
    .ex-paleta-pe { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted-soft); }

    /* telas médias: as abas mostram só o ícone (o nome fica no title) */
    @media (max-width: 1100px) {
      .ex-nav .ex-aba .rot, .ex-marca b, .ex-saude span { display: none; }
      .ex-busca-btn { width: 34px; padding: 0; justify-content: center; }
      .ex-busca-btn span, .ex-busca-btn kbd { display: none; }
    }
    @media (max-width: 640px) {
      .ex-topo { padding: 0 10px; }
      .ex-marca { padding-right: 6px; margin-right: 0; }
      .ex-tag, .ex-acoes .ex-tema, .ex-acoes .ex-voltar { display: none; }
      .ex-abertas .ex-aba .rot { display: none; }
      .ex-tela { padding: 16px 16px 24px; }
      .ex-linha { grid-template-columns: 34px minmax(0, 1fr) 90px; }
      .ex-linha .ex-desc, .ex-linha .ex-estrela { display: none; }
      .ex-estrela { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .ex-card, .ex-esqueleto { transition: none; animation: none; transform: none; } }
  </style>

<body>
  <div id="root"></div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const e = React.createElement;
      const { useState, useEffect, useRef, useLayoutEffect } = React;
      const { Icon, CATEGORY_CHOICES } = window.Icons;
      const CATEGORIAS = CATEGORY_CHOICES.reduce((acc, c) => { acc[c.key] = c; return acc; }, {});
      const STATUS = { online: 'No ar', offline: 'Fora do ar', checking: 'Verificando' };
      const COR_STATUS = { online: 'var(--accent)', offline: 'var(--error)', checking: 'var(--warn)' };
      const PAGINAS = { painel: ['Painel', 'LayoutDashboard'], chamados: ['Chamados', 'Headset'], resultados: ['Resultados', 'BarChart3'] };
      const PORTA_PROXY = 8318; // a mesma do app.js
      const CARTAO_ALTURA = 148, CARTAO_LARGURA_MIN = 240, LINHA_ALTURA = 52, VAO = 12;

      function ler(chave, padrao) {
        try { const v = localStorage.getItem(chave); return v ? JSON.parse(v) : padrao; } catch (err) { return padrao; }
      }
      function gravar(chave, valor) {
        try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (err) { /* sem armazenamento: vale só nesta aba */ }
      }
      const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
      const hora = (d) => (d ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
      const token = () => ((window.ArxAcessosHub && window.ArxAcessosHub.ler()) || {}).userToken || '';
      const isDb = (a) => (a.categories || []).includes('db');
      const categoria = (a) => ((a.categories || []).map((k) => CATEGORIAS[k] && CATEGORIAS[k].label).filter(Boolean)[0]) || 'Geral';
      // passe do proxy: sem token (cofre travado) a tela abre sem passe e só funciona se a automação for de todo mundo
      const pedirPasse = (id) => fetch('/api/automations/' + id + '/passe', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Glpi-Token': token() } })
        .then((r) => (r.ok ? r.json() : {})).then((r) => r.passe || '').catch(() => '');
      const urlTela = (a, passe) => `${location.protocol}//${location.hostname}:${PORTA_PROXY}/a/${a.id}/` + (passe ? '?passe=' + encodeURIComponent(passe) : '');

      function Status({ s }) {
        return e('span', { className: 'ex-status ' + (s || 'checking') }, [e('i', { key: 'i' }), STATUS[s] || STATUS.checking]);
      }
      const icone = (a, tam, cls) => e('span', { key: 'ic', className: cls || 'ex-ic', style: { background: a.color + '22' } }, Icon(a.icon, tam || 18, a.color));

      // Quantos cartões cabem na área visível: colunas pela largura, linhas pela altura que sobra abaixo da grade.
      function useCabe(refArea, refGrade, visao, deps) {
        const [cabe, setCabe] = useState({ colunas: 4, porPagina: 12 });
        useLayoutEffect(() => {
          const medir = () => {
            const area = refArea.current, grade = refGrade.current;
            if (!area || !grade || !area.clientHeight) return;
            const largura = grade.clientWidth;
            const topo = grade.getBoundingClientRect().top - area.getBoundingClientRect().top + area.scrollTop;
            const sobra = area.clientHeight - topo - 72; // 72: paginação e respiro do fim
            const colunas = visao === 'lista' ? 1 : Math.max(1, Math.floor((largura + VAO) / (CARTAO_LARGURA_MIN + VAO)));
            const linhas = visao === 'lista'
              ? Math.max(4, Math.floor(sobra / LINHA_ALTURA))
              : Math.max(1, Math.floor((sobra + VAO) / (CARTAO_ALTURA + VAO)));
            setCabe((c) => (c.colunas === colunas && c.porPagina === colunas * linhas ? c : { colunas, porPagina: colunas * linhas }));
          };
          medir();
          const ro = new ResizeObserver(medir);
          if (refArea.current) ro.observe(refArea.current);
          window.addEventListener('resize', medir);
          return () => { ro.disconnect(); window.removeEventListener('resize', medir); };
        }, deps);
        return cabe;
      }

      function Painel({ lista, atualizado, abrir, favoritas, alternarFav, recentes, areaRef }) {
        const [busca, setBusca] = useState('');
        const [filtro, setFiltro] = useState('todas');
        const [grupo, setGrupo] = useState('todas');
        const [visao, setVisao] = useState(() => ler('arxhub_exemplo_visao', 'grade'));
        const [pagina, setPagina] = useState(0);
        const gradeRef = useRef(null);

        const todas = lista || [];
        const no = todas.filter((a) => a.status === 'online').length;
        const fora = todas.filter((a) => a.status === 'offline');
        const q = busca.trim().toLowerCase();
        const filtradas = todas.filter((a) =>
          (!q || (a.name + ' ' + (a.description || '')).toLowerCase().includes(q)) &&
          (filtro === 'todas' || a.status === filtro) &&
          (grupo === 'todas' || (grupo === 'db') === isDb(a)));
        const rapidas = [...favoritas, ...recentes.filter((id) => !favoritas.includes(id))]
          .map((id) => todas.find((a) => a.id === id)).filter(Boolean).slice(0, 8);

        const cabe = useCabe(areaRef, gradeRef, visao, [visao, !!lista, fora.length > 0, rapidas.length > 0]);
        const total = Math.max(1, Math.ceil(filtradas.length / cabe.porPagina));
        const atual = Math.min(pagina, total - 1);
        const fatia = filtradas.slice(atual * cabe.porPagina, (atual + 1) * cabe.porPagina);
        useEffect(() => setPagina(0), [q, filtro, grupo]);

        const trocarVisao = (v) => { setVisao(v); gravar('arxhub_exemplo_visao', v); };
        const estrela = (a) => e('button', {
          key: 'fav', type: 'button', className: 'ex-estrela', 'aria-pressed': favoritas.includes(a.id) ? 'true' : 'false',
          'aria-label': (favoritas.includes(a.id) ? 'Tirar ' : 'Marcar ') + a.name + ' como favorita', title: 'Favorita',
          onClick: (ev) => { ev.stopPropagation(); alternarFav(a.id); },
        }, favoritas.includes(a.id) ? '★' : '☆');
        const teclaAbre = (a) => (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(a); } };
        const cartao = (a) => e('div', {
          key: a.id, role: 'button', tabIndex: 0, className: 'ex-card' + (a.status === 'offline' ? ' fora' : ''),
          'aria-label': 'Abrir ' + a.name, onClick: () => abrir(a), onKeyDown: teclaAbre(a),
        }, [
          estrela(a),
          e('div', { key: 't', className: 'ex-card-topo' }, [icone(a), e('div', { key: 'n', style: { minWidth: 0 } }, [
            e('div', { key: 'n', className: 'ex-nome', title: a.name }, a.name),
            e('div', { key: 'c', className: 'ex-cat' }, categoria(a)),
          ])]),
          e('p', { key: 'd', className: 'ex-desc' }, a.description || 'Sem descrição'),
          e('div', { key: 'r', className: 'ex-rodape' }, [e(Status, { key: 's', s: a.status }), e('span', { key: 'a', className: 'ex-abrir' }, ['Abrir', Icon('ExternalLink', 13, 'currentColor')])]),
        ]);
        const linha = (a) => e('div', { key: a.id, role: 'button', tabIndex: 0, className: 'ex-linha', 'aria-label': 'Abrir ' + a.name, onClick: () => abrir(a), onKeyDown: teclaAbre(a) }, [
          icone(a),
          e('span', { key: 'n', className: 'ex-nome' }, a.name),
          e('p', { key: 'd', className: 'ex-desc' }, a.description || 'Sem descrição'),
          e(Status, { key: 's', s: a.status }),
          estrela(a),
        ]);
        const seg = (valor, atualV, set, rotulo, n) => e('button', { key: valor, type: 'button', 'aria-pressed': atualV === valor ? 'true' : 'false', onClick: () => set(valor) },
          n == null ? rotulo : [rotulo, ' ', e('span', { key: 'n', className: 'n' }, n)]);

        // números de página com reticências: 1 … 4 5 6 … 10
        const numeros = [];
        for (let i = 0; i < total; i++) {
          if (i === 0 || i === total - 1 || Math.abs(i - atual) <= 1) numeros.push(i);
          else if (numeros[numeros.length - 1] !== '…') numeros.push('…');
        }

        return e('div', { className: 'ex-tela' }, [
          e('header', { key: 'cab', className: 'ex-cab' }, [
            e('div', { key: 't' }, [
              e('h2', { key: 'h' }, 'Automações'),
              e('p', { key: 'p' }, lista ? plural(todas.length, 'automação', 'automações') + ', ' + no + ' no ar · atualizado às ' + hora(atualizado) : 'Carregando automações'),
            ]),
          ]),

          fora.length ? e('div', { key: 'alerta', className: 'ex-alerta', role: 'status' }, [
            Icon('AlertCircle', 18, 'var(--error)'),
            e('div', { key: 't' }, [e('b', { key: 'b' }, plural(fora.length, 'automação fora do ar', 'automações fora do ar') + ': '), fora.map((a) => a.name).join(', '), '.']),
          ]) : null,

          rapidas.length ? e('div', { key: 'rap', className: 'ex-rapido', 'aria-label': 'Acesso rápido' }, [
            e('span', { key: 'r', className: 'ex-rapido-rot' }, 'Acesso rápido'),
            ...rapidas.map((a) => e('button', { key: a.id, type: 'button', className: 'ex-pilula', onClick: () => abrir(a), title: favoritas.includes(a.id) ? 'Favorita' : 'Aberta há pouco' }, [
              icone(a, 13, 'ic'), a.name, e('span', { key: 'p', style: { width: 6, height: 6, borderRadius: '50%', background: COR_STATUS[a.status] || COR_STATUS.checking } }),
            ])),
          ]) : null,

          e('div', { key: 'barra', className: 'ex-barra' }, [
            e('label', { key: 'b', className: 'ex-filtro' }, [
              Icon('Search', 15, 'var(--muted-soft)'),
              e('input', { key: 'i', value: busca, onChange: (ev) => setBusca(ev.target.value), placeholder: 'Filtrar por nome ou descrição', 'aria-label': 'Filtrar automações' }),
            ]),
            e('div', { key: 'g', className: 'ex-seg', role: 'group', 'aria-label': 'Grupo' }, [
              seg('todas', grupo, setGrupo, 'Todas'), seg('auto', grupo, setGrupo, 'Automações'), seg('db', grupo, setGrupo, 'Banco de Dados'),
            ]),
            e('div', { key: 's', className: 'ex-seg', role: 'group', 'aria-label': 'Situação' }, [
              seg('todas', filtro, setFiltro, 'Todas', todas.length), seg('online', filtro, setFiltro, 'No ar', no), seg('offline', filtro, setFiltro, 'Fora', fora.length),
            ]),
            e('div', { key: 'v', className: 'ex-seg', role: 'group', 'aria-label': 'Exibição' }, [
              e('button', { key: 'g', type: 'button', 'aria-pressed': visao === 'grade' ? 'true' : 'false', onClick: () => trocarVisao('grade'), title: 'Cartões', 'aria-label': 'Cartões' }, Icon('LayoutDashboard', 14, 'currentColor')),
              e('button', { key: 'l', type: 'button', 'aria-pressed': visao === 'lista' ? 'true' : 'false', onClick: () => trocarVisao('lista'), title: 'Lista', 'aria-label': 'Lista' }, Icon('FileText', 14, 'currentColor')),
            ]),
          ]),

          !lista
            ? e('div', { key: 'esq', ref: gradeRef, className: 'ex-grade', style: { '--colunas': cabe.colunas }, 'aria-busy': 'true' }, Array.from({ length: cabe.porPagina }, (_, i) => e('div', { key: i, className: 'ex-esqueleto' })))
            : filtradas.length
              ? (visao === 'lista'
                  ? e('div', { key: 'l', ref: gradeRef, className: 'ex-lista' }, fatia.map(linha))
                  : e('div', { key: 'g', ref: gradeRef, className: 'ex-grade', style: { '--colunas': cabe.colunas } }, fatia.map(cartao)))
              : e('div', { key: 'vazio', ref: gradeRef, className: 'admin-vazio' }, [
                  todas.length ? 'Nenhuma automação com esses filtros. ' : 'Nenhuma automação cadastrada.',
                  todas.length ? e('button', { key: 'l', type: 'button', className: 'ex-link', onClick: () => { setBusca(''); setFiltro('todas'); setGrupo('todas'); } }, 'Limpar filtros') : null,
                ]),

          lista && filtradas.length ? e('nav', { key: 'pag', className: 'ex-paginacao', 'aria-label': 'Páginas' }, [
            e('span', { key: 't' }, 'Mostrando ' + (atual * cabe.porPagina + 1) + ' a ' + (atual * cabe.porPagina + fatia.length) + ' de ' + filtradas.length),
            total > 1 ? e('div', { key: 'p', className: 'ex-paginas' }, [
              e('button', { key: 'ant', type: 'button', className: 'ex-pag', disabled: atual === 0, onClick: () => setPagina(atual - 1), 'aria-label': 'Página anterior' }, '‹'),
              ...numeros.map((n, i) => n === '…'
                ? e('span', { key: 'r' + i, style: { padding: '0 4px' } }, '…')
                : e('button', { key: n, type: 'button', className: 'ex-pag', 'aria-current': n === atual ? 'page' : undefined, onClick: () => setPagina(n) }, String(n + 1))),
              e('button', { key: 'prox', type: 'button', className: 'ex-pag', disabled: atual >= total - 1, onClick: () => setPagina(atual + 1), 'aria-label': 'Próxima página' }, '›'),
            ]) : null,
          ]) : null,
        ]);
      }

      // Busca geral (Ctrl K): páginas e automações, setas para escolher e Enter para abrir.
      function Paleta({ lista, irPara, abrir, fechar }) {
        const [texto, setTexto] = useState('');
        const [sel, setSel] = useState(0);
        const q = texto.trim().toLowerCase();
        const paginas = Object.keys(PAGINAS).filter((k) => !q || PAGINAS[k][0].toLowerCase().includes(q)).map((k) => ({ tipo: 'pagina', k }));
        const autos = (lista || []).filter((a) => !q || (a.name + ' ' + (a.description || '')).toLowerCase().includes(q)).slice(0, 30).map((a) => ({ tipo: 'auto', a }));
        const opcoes = [...paginas, ...autos];
        const escolher = (o) => { if (!o) return; fechar(); if (o.tipo === 'pagina') irPara(o.k); else abrir(o.a); };
        const tecla = (ev) => {
          if (ev.key === 'ArrowDown') { ev.preventDefault(); setSel((s) => Math.min(s + 1, opcoes.length - 1)); }
          if (ev.key === 'ArrowUp') { ev.preventDefault(); setSel((s) => Math.max(s - 1, 0)); }
          if (ev.key === 'Enter') escolher(opcoes[sel]);
          if (ev.key === 'Escape') fechar();
        };
        useEffect(() => setSel(0), [q]);
        const item = (o, i) => e('li', {
          key: o.tipo + (o.k || o.a.id), className: 'opcao', role: 'option', 'aria-selected': i === sel ? 'true' : 'false',
          onMouseEnter: () => setSel(i), onClick: () => escolher(o),
        }, o.tipo === 'pagina'
          ? [Icon(PAGINAS[o.k][1], 15, 'var(--muted)'), PAGINAS[o.k][0], e('span', { key: 'd', className: 'dir' }, 'Página')]
          : [icone(o.a, 13, 'ex-pilula-ic'), o.a.name, e('span', { key: 'd', className: 'dir' }, STATUS[o.a.status] || STATUS.checking)]);
        return e('div', { className: 'ex-fundo', onMouseDown: (ev) => { if (ev.target === ev.currentTarget) fechar(); } },
          e('div', { className: 'ex-paleta', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Buscar no Hub' }, [
            e('div', { key: 'b', className: 'ex-paleta-busca' }, [
              Icon('Search', 16, 'var(--muted-soft)'),
              e('input', { key: 'i', autoFocus: true, value: texto, onChange: (ev) => setTexto(ev.target.value), onKeyDown: tecla, placeholder: 'Buscar páginas e automações', 'aria-label': 'Buscar' }),
              e('kbd', { key: 'k' }, 'Esc'),
            ]),
            e('ul', { key: 'l', role: 'listbox' }, opcoes.length ? [
              paginas.length ? e('li', { key: 'tp', className: 'titulo' }, 'Páginas') : null,
              ...paginas.map((o, i) => item(o, i)),
              autos.length ? e('li', { key: 'ta', className: 'titulo' }, 'Automações') : null,
              ...autos.map((o, i) => item(o, paginas.length + i)),
            ] : [e('li', { key: 'v', className: 'titulo', style: { textTransform: 'none' } }, 'Nada encontrado')]),
            e('div', { key: 'p', className: 'ex-paleta-pe' }, [e('span', { key: 'a' }, '↑ ↓ escolher'), e('span', { key: 'b' }, 'Enter abrir'), e('span', { key: 'c' }, 'Esc fechar')]),
          ]));
      }

      function Visor({ a, passe, recarga, fechar, recarregar, ativo }) {
        const [carregado, setCarregado] = useState(false);
        useEffect(() => setCarregado(false), [recarga, passe]);
        return e('div', { className: 'ex-visor', style: ativo ? null : { display: 'none' } }, [
          e('div', { key: 'b', className: 'ex-visor-barra' }, [
            icone(a, 13, 'ex-pilula-ic'), e('b', { key: 'n' }, a.name), e(Status, { key: 's', s: a.status }),
            e('div', { key: 'a', className: 'acoes' }, [
              e('button', { key: 'r', type: 'button', onClick: recarregar, title: 'Recarregar a tela' }, [Icon('RefreshCw', 13, 'currentColor'), 'Recarregar']),
              e('button', { key: 'n', type: 'button', onClick: () => window.open(urlTela(a, passe), '_blank'), title: 'Abrir em nova aba do navegador' }, [Icon('ExternalLink', 13, 'currentColor'), 'Nova aba']),
              e('button', { key: 'f', type: 'button', onClick: fechar, title: 'Fechar' }, [Icon('X', 13, 'currentColor'), 'Fechar']),
            ]),
          ]),
          passe === null ? null : e('iframe', { key: 'f' + recarga, src: urlTela(a, passe), title: a.name, onLoad: () => setCarregado(true) }),
          carregado ? null : e('div', { key: 'c', className: 'ex-carregando' }, a.status === 'offline'
            ? [Icon('WifiOff', 26, 'var(--error)'), 'A automação está fora do ar. Tente de novo em instantes.']
            : [e('div', { key: 's', style: { display: 'flex', animation: 'spin 1s linear infinite' } }, Icon('Loader2', 24, 'var(--accent)')), 'Abrindo ' + a.name]),
        ]);
      }

      function Hub() {
        const [lista, setLista] = useState(null);
        const [atualizado, setAtualizado] = useState(null);
        const [pagina, setPagina] = useState('painel');
        const [montadas, setMontadas] = useState({ painel: true });
        const [abertas, setAbertas] = useState([]); // [{ id, passe, recarga }]
        const [ativa, setAtiva] = useState(null);
        const [paleta, setPaleta] = useState(false);
        const [favoritas, setFavoritas] = useState(() => ler('arxhub_exemplo_favoritas', []));
        const [recentes, setRecentes] = useState(() => ler('arxhub_exemplo_recentes', []));
        const areaRef = useRef(null);

        useEffect(() => {
          let vivo = true, es;
          const carregar = () => fetch('/api/exemplo/automacoes').then((r) => (r.ok ? r.json() : null)).then((d) => {
            if (vivo && Array.isArray(d)) { setLista(d); setAtualizado(new Date()); }
          }).catch(() => { /* rede oscilou: a próxima volta tenta de novo */ });
          carregar();
          try { es = new EventSource('/api/events'); es.onmessage = carregar; } catch (err) { /* sem SSE: fica a volta de 15 s */ }
          const t = setInterval(carregar, 15000);
          return () => { vivo = false; clearInterval(t); if (es) es.close(); };
        }, []);

        useEffect(() => {
          const tecla = (ev) => {
            if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); setPaleta((p) => !p); }
            const digitando = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
            if (ev.key === '/' && !digitando) { ev.preventDefault(); setPaleta(true); }
          };
          window.addEventListener('keydown', tecla);
          return () => window.removeEventListener('keydown', tecla);
        }, []);

        const irPara = (p) => { setAtiva(null); setPagina(p); setMontadas((m) => (m[p] ? m : Object.assign({}, m, { [p]: true }))); };
        const abrir = (a) => {
          setAtiva(a.id);
          setRecentes((r) => { const n = [a.id, ...r.filter((x) => x !== a.id)].slice(0, 6); gravar('arxhub_exemplo_recentes', n); return n; });
          if (abertas.some((x) => x.id === a.id)) return;
          setAbertas((l) => [...l, { id: a.id, passe: null, recarga: 0 }]);
          pedirPasse(a.id).then((passe) => setAbertas((l) => l.map((x) => (x.id === a.id ? Object.assign({}, x, { passe }) : x))));
        };
        const fechar = (id) => {
          const resto = abertas.filter((x) => x.id !== id);
          setAbertas(resto);
          if (ativa === id) setAtiva(resto.length ? resto[resto.length - 1].id : null);
        };
        const recarregar = (id) => setAbertas((l) => l.map((x) => (x.id === id ? Object.assign({}, x, { recarga: x.recarga + 1 }) : x)));
        const alternarFav = (id) => setFavoritas((f) => { const n = f.includes(id) ? f.filter((x) => x !== id) : [...f, id]; gravar('arxhub_exemplo_favoritas', n); return n; });
        const tema = () => {
          const d = document.documentElement;
          const t = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          d.setAttribute('data-theme', t);
          gravar('arxhub_exemplo_tema', t);
        };

        const todas = lista || [];
        const porId = (id) => todas.find((a) => a.id === id);
        const no = todas.filter((a) => a.status === 'online').length;
        const fora = todas.length - no - todas.filter((a) => a.status === 'checking').length;
        const aAtiva = ativa ? porId(ativa) : null;

        const abaPagina = (k) => e('button', {
          key: k, type: 'button', className: 'ex-aba' + (!ativa && pagina === k ? ' ativo' : ''), onClick: () => irPara(k),
          title: PAGINAS[k][0], 'aria-current': !ativa && pagina === k ? 'page' : undefined,
        }, [Icon(PAGINAS[k][1], 15, 'currentColor'), e('span', { key: 'r', className: 'rot' }, PAGINAS[k][0])]);
        const telasAbertas = abertas.map((x) => porId(x.id)).filter(Boolean);
        const abaRef = useRef(null);
        // a aba ativa sempre à vista quando a faixa rola
        useEffect(() => { const el = abaRef.current; if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }, [ativa]);

        const topo = e('header', { key: 'topo', className: 'ex-topo' }, [
          e('div', { key: 'm', className: 'ex-marca' }, [e('div', { key: 'l', className: 'ex-logo' }, 'ARX'), e('b', { key: 'b', style: { fontSize: 14, whiteSpace: 'nowrap' } }, 'ARX Hub'), e('span', { key: 't', className: 'ex-tag' }, 'Exemplo')]),
          e('nav', { key: 'n', className: 'ex-nav', 'aria-label': 'Páginas' }, Object.keys(PAGINAS).map(abaPagina)),
          telasAbertas.length ? e('span', { key: 'sep', className: 'ex-sep' }) : null,
          // telas abertas viram abas: clique do meio fecha, como no navegador; a faixa rola com a roda do mouse
          e('div', {
            key: 'ab', className: 'ex-abertas', role: 'tablist', 'aria-label': 'Automações abertas',
            onWheel: (ev) => { if (ev.deltaY) ev.currentTarget.scrollLeft += ev.deltaY; },
          }, telasAbertas.map((a) => e('div', {
            key: a.id, ref: ativa === a.id ? abaRef : null, role: 'tab', tabIndex: 0, 'aria-selected': ativa === a.id ? 'true' : 'false',
            className: 'ex-aba' + (ativa === a.id ? ' ativo' : ''), title: a.name,
            onClick: () => setAtiva(a.id), onKeyDown: (ev) => { if (ev.key === 'Enter') setAtiva(a.id); },
            onAuxClick: (ev) => { if (ev.button === 1) { ev.preventDefault(); fechar(a.id); } },
          }, [
            e('span', { key: 'p', className: 'ponto', style: { background: COR_STATUS[a.status] || COR_STATUS.checking } }),
            Icon(a.icon, 14, a.color),
            e('span', { key: 'r', className: 'rot' }, a.name),
            e('span', { key: 'x', className: 'fechar', role: 'button', 'aria-label': 'Fechar ' + a.name, onClick: (ev) => { ev.stopPropagation(); fechar(a.id); } }, Icon('X', 12, 'currentColor')),
          ]))),
          e('div', { key: 'e', className: 'ex-espaco' }),
          e('div', { key: 'ac', className: 'ex-acoes' }, [
            e('button', { key: 'b', type: 'button', className: 'ex-busca-btn', onClick: () => setPaleta(true), 'aria-label': 'Buscar no Hub' }, [Icon('Search', 15, 'currentColor'), e('span', { key: 's' }, 'Buscar'), e('kbd', { key: 'k' }, 'Ctrl K')]),
            window.AjudaBotao ? e(window.AjudaBotao, { key: 'aj', aba: aAtiva ? null : pagina }) : null,
            window.AlertasSino ? e(window.AlertasSino, { key: 'al' }) : null,
            window.MeusAcessosBotao ? e(window.MeusAcessosBotao, { key: 'mac' }) : null,
            e('button', { key: 't', type: 'button', className: 'ex-icone-btn ex-tema', onClick: tema, title: 'Trocar tema', 'aria-label': 'Trocar tema' }, Icon('Eye', 15, 'currentColor')),
            e('a', { key: 'v', className: 'ex-icone-btn ex-voltar', href: '/', title: 'Voltar ao Hub atual', 'aria-label': 'Voltar ao Hub atual' }, Icon('ArrowLeft', 15, 'currentColor')),
            e('span', { key: 's', className: 'ex-saude', title: lista ? no + ' de ' + todas.length + ' no ar' : '' }, [
              e('i', { key: 'i', className: 'pulse-dot', style: { position: 'relative', background: fora > 0 ? 'var(--warn)' : 'var(--accent)', color: fora > 0 ? 'var(--warn)' : 'var(--accent)' } }),
              e('span', { key: 't' }, lista ? no + '/' + todas.length + ' no ar' : '…'),
            ]),
          ]),
        ]);

        const legado = (k, View) => (montadas[k] && View ? e('div', { key: k, className: 'ex-pagina ex-legado', hidden: !!ativa || pagina !== k }, e(View)) : null);
        const conteudo = e('main', { key: 'c', className: 'ex-conteudo' }, [
          e('div', { key: 'painel', ref: areaRef, className: 'ex-pagina', hidden: !!ativa || pagina !== 'painel' },
            e(Painel, { lista, atualizado, abrir, favoritas, alternarFav, recentes, areaRef })),
          legado('chamados', window.ChamadosView),
          legado('resultados', window.ResultadosView),
          // cada tela aberta fica montada (escondida) para não perder o que está rodando nela
          ...abertas.map((x) => { const a = porId(x.id); return a ? e(Visor, { key: 'v' + x.id, a, passe: x.passe, recarga: x.recarga, ativo: ativa === x.id, fechar: () => fechar(x.id), recarregar: () => recarregar(x.id) }) : null; }),
        ]);

        return e('div', { className: 'ex-app' }, [
          topo,
          conteudo,
          paleta ? e(Paleta, { key: 'k', lista, irPara, abrir, fechar: () => setPaleta(false) }) : null,
        ]);
      }

      const raiz = document.getElementById('root');
      if (ReactDOM.createRoot) ReactDOM.createRoot(raiz).render(e(Hub)); else ReactDOM.render(e(Hub), raiz);
    });
  </script>
</body>
</html>
